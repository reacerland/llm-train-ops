[project]
name = "trainops"
version = "0.1.0"
description = "LLM train CI/CD toolkit"
requires-python = ">=3.10"
dependencies = [
    "modelscope[datasets]>=1.20",
    "safetensors",
    "tomli>=2; python_version < \"3.11\"",
    "tqdm>=4.64",
    "torch",
    "torchvision",
    "typer>=0.12",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[project.optional-dependencies]
hf = ["transformers>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
trainops = "trainops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainops"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with --runslow to run)",
]
